<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coders Era - Event System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;

            background: #ffffff;

            padding: 45px 35px;

            border-radius: 18px;

            text-align: center;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .logo {
            width: 90px;
            height: 90px;

            object-fit: contain;

            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            color: #111827;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 16px;

            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            flex-direction: column;

            gap: 15px;
        }

        .btn {
            display: block;

            width: 100%;

            padding: 14px 20px;

            border-radius: 9px;

            text-decoration: none;

            font-size: 16px;
            font-weight: 600;

            transition: 0.2s ease;
        }

        .primary {
            background: #111827;
            color: white;
        }

        .primary:hover {
            background: #1f2937;
            transform: translateY(-1px);
        }

        .secondary {
            background: #f3f4f6;
            color: #111827;
        }

        .secondary:hover {
            background: #e5e7eb;
            transform: translateY(-1px);
        }

        .admin {
            background: #ffffff;
            color: #111827;

            border: 1px solid #d1d5db;
        }

        .admin:hover {
            background: #f9fafb;
        }

        .footer {
            margin-top: 30px;

            font-size: 13px;

            color: #9ca3af;
        }

        @media (max-width: 500px) {

            .container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 27px;
            }

            .logo {
                width: 75px;
                height: 75px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Logo -->
        <img
            src="assets/Logo.jpeg"
            alt="Coders Era Logo"
            class="logo"
        >

        <!-- Heading -->
        <h1>CODERS ERA</h1>

        <p class="subtitle">
            Event Registration & Ticketing System
        </p>

        <!-- Navigation -->
        <div class="buttons">

            <a
                href="registration.html"
                class="btn primary"
            >
                Register for Event
            </a>

            <a
                href="admin-login.html"
                class="btn admin"
            >
                Admin Login
            </a>

        </div>

        <div class="footer">
            © 2026 Coders Era. All rights reserved.
        </div>

    </div>

</body>
</html>
