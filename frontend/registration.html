<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coders Era - Event Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* =========================
           ADMIN LOGIN BUTTON
        ========================== */

        .admin-link {
            position: fixed;
            top: 20px;
            right: 25px;
            padding: 11px 18px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            transition: 0.2s ease;
        }

        .admin-link:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        /* =========================
           PAGE
        ========================== */

        .page-container {
            min-height: 100vh;
            padding: 50px 20px;
        }

        .registration-wrapper {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           HEADER
        ========================== */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
            color: #111827;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        /* =========================
           EVENT CARD
        ========================== */

        .event-card {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .event-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #111827;
        }

        .event-card p {
            color: #6b7280;
            line-height: 1.6;
        }

        /* =========================
           FORM
        ========================== */

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #111827;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #374151;
        }

        label span {
            color: #dc2626;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s ease;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input::placeholder {
            color: #9ca3af;
        }

        /* =========================
           SUBMIT
        ========================== */

        .submit-section {
            margin-top: 30px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .submit-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* =========================
           MESSAGE
        ========================== */

        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-size: 14px;
        }

        #message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        #message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        /* =========================
           FOOTER
        ========================== */

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #6b7280;
            font-size: 13px;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 700px) {

            .registration-wrapper {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .header h1 {
                font-size: 25px;
            }

            .admin-link {
                top: 12px;
                right: 12px;
                padding: 9px 13px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ADMIN LOGIN
    ========================== -->

    <a
        href="admin-login.html"
        class="admin-link"
    >
        🔐 Admin Login
    </a>


    <!-- =========================
         PAGE
    ========================== -->

    <div class="page-container">

        <div class="registration-wrapper">


            <!-- =========================
                 HEADER
            ========================== -->

            <div class="header">

                <img
                    src="assets/Logo.jpeg"
                    alt="Coders Era Logo"
                    class="logo"
                >

                <h1>
                    Coders Era Event Registration
                </h1>

                <p>
                    Register for the upcoming Coders Era Workshop
                </p>

            </div>


            <!-- =========================
                 EVENT
            ========================== -->

            <div class="event-card">

                <h2 id="event-title">
                    Coders Era Workshop
                </h2>

                <p id="event-description">
                    Technical workshop for students
                </p>

            </div>


            <!-- =========================
                 REGISTRATION FORM
            ========================== -->

            <form id="registration-form">


                <h2 class="section-title">
                    Participant Information
                </h2>


                <div class="form-grid">


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="name">
                            Full Name <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- ROLL NUMBER -->

                    <div class="form-group">

                        <label for="roll_no">
                            Roll Number <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="roll_no"
                            name="roll_no"
                            placeholder="Enter your roll number"
                            required
                        >

                    </div>


                    <!-- COLLEGE EMAIL -->

                    <div class="form-group">

                        <label for="college_email">
                            Official College Email <span>*</span>
                        </label>

                        <input
                            type="email"
                            id="college_email"
                            name="college_email"
                            placeholder="example@college.edu"
                            required
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number <span>*</span>
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required
                        >

                    </div>


                    <!-- HOST INSTITUTION -->

                    <div class="form-group full-width">

                        <label for="host_institution">
                            Host Institution / College <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="host_institution"
                            name="host_institution"
                            placeholder="Enter your college/institution name"
                            required
                        >

                    </div>


                    <!-- DEGREE -->

                    <div class="form-group">

                        <label for="degree">
                            Degree <span>*</span>
                        </label>

                        <select
                            id="degree"
                            name="degree"
                            required
                        >

                            <option value="">
                                Select Degree
                            </option>

                            <option value="B.Tech">
                                B.Tech
                            </option>

                            <option value="B.E">
                                B.E
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="B.Sc">
                                B.Sc
                            </option>

                            <option value="M.Tech">
                                M.Tech
                            </option>

                            <option value="MCA">
                                MCA
                            </option>

                            <option value="M.Sc">
                                M.Sc
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- BRANCH -->

                    <div class="form-group">

                        <label for="branch">
                            Branch / Specialization <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="branch"
                            name="branch"
                            placeholder="e.g. Computer Science"
                            required
                        >

                    </div>


                    <!-- YEAR OF STUDY -->

                    <div class="form-group">

                        <label for="year_of_study">
                            Year of Study <span>*</span>
                        </label>

                        <select
                            id="year_of_study"
                            name="year_of_study"
                            required
                        >

                            <option value="">
                                Select Year
                            </option>

                            <option value="1st Year">
                                1st Year
                            </option>

                            <option value="2nd Year">
                                2nd Year
                            </option>

                            <option value="3rd Year">
                                3rd Year
                            </option>

                            <option value="4th Year">
                                4th Year
                            </option>

                            <option value="Postgraduate">
                                Postgraduate
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                </div>


                <!-- =========================
                     SUBMIT
                ========================== -->

                <div class="submit-section">

                    <button
                        type="submit"
                        class="submit-btn"
                        id="submit-btn"
                    >
                        Register for Event
                    </button>

                </div>


                <!-- MESSAGE -->

                <div id="message"></div>


            </form>


            <!-- =========================
                 FOOTER
            ========================== -->

            <div class="footer">

                © 2026 Coders Era. All rights reserved.

            </div>


        </div>

    </div>


    <!-- =========================
         REGISTRATION JAVASCRIPT
    ========================== -->

    <script>

        const API_URL = "http://localhost:5000";

        const registrationForm =
            document.getElementById("registration-form");

        const message =
            document.getElementById("message");

        const submitBtn =
            document.getElementById("submit-btn");


        /*
         * EVENT ID
         *
         * Your current database event:
         * Coders Era Workshop = ID 1
         */

        const EVENT_ID = 1;


        registrationForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                message.className = "";
                message.style.display = "none";

                submitBtn.disabled = true;
                submitBtn.textContent = "Registering...";


                const formData = {

                    event_id: EVENT_ID,

                    name:
                        document.getElementById("name").value.trim(),

                    email:
                        document.getElementById("college_email").value.trim(),

                    phone:
                        document.getElementById("phone").value.trim(),

                    roll_no:
                        document.getElementById("roll_no").value.trim(),

                    college_email:
                        document.getElementById("college_email").value.trim(),

                    host_institution:
                        document.getElementById("host_institution").value.trim(),

                    degree:
                        document.getElementById("degree").value,

                    branch:
                        document.getElementById("branch").value.trim(),

                    year_of_study:
                        document.getElementById("year_of_study").value

                };


                try {

                    const response = await fetch(
                        `${API_URL}/api/registrations`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(formData)
                        }
                    );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Registration failed"
                        );

                    }


                    /*
                     * SUCCESS
                     */

                    message.className = "success";

                    message.style.display = "block";

                    message.textContent =
                        "Registration successful! Redirecting to your ticket...";


                    /*
                     * REDIRECT TO TICKET
                     */

                    if (data.ticket_url) {

                        setTimeout(() => {

                            window.location.href =
                                data.ticket_url;

                        }, 1000);

                    } else if (
                        data.ticket &&
                        data.ticket.ticket_code
                    ) {

                        setTimeout(() => {

                            window.location.href =
                                `ticket.html?ticketCode=${encodeURIComponent(
                                    data.ticket.ticket_code
                                )}`;

                        }, 1000);

                    }


                } catch (error) {

                    console.error(
                        "Registration Error:",
                        error
                    );


                    message.className = "error";

                    message.style.display = "block";

                    message.textContent =
                        error.message ||
                        "Unable to complete registration.";


                    submitBtn.disabled = false;

                    submitBtn.textContent =
                        "Register for Event";

                }

            }
        );

    </script>

</body>
</html>
